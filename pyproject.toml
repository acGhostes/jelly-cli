[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jelly-cli"
dynamic = ["version"]
description = "A terminal Jellyfin client with fzf browsing and mpv playback"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/acGhostes/jelly-cli"
Issues = "https://github.com/acGhostes/jelly-cli/issues"

[project.scripts]
jelly-cli = "jelly_cli.cli:main"

[tool.setuptools.packages.find]
include = ["jelly_cli*"]

[tool.setuptools.dynamic]
version = {attr = "jelly_cli.__version__"}
