name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install playback test dependencies
        run: sudo apt-get update && sudo apt-get install -y mpv fzf ffmpeg xvfb xauth xdotool
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build and check release
        run: |
          python scripts/build_release.py
          python dist/jelly-cli.pyz --version
          sh -n install.sh
