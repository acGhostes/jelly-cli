name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y mpv fzf ffmpeg xvfb xauth xdotool
      - run: python -m unittest discover -s tests -v
      - name: Build release and validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os; from jelly_cli import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
          python scripts/build_release.py
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "jelly-cli $RELEASE_TAG" --notes-file RELEASE_NOTES.md dist/jelly-cli.pyz dist/jelly-cli.pyz.sha256 dist/install.sh dist/jelly-cli-hosting.zip dist/releases/*/*.pyz dist/releases/*/*.sha256
